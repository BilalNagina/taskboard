name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the integration tests against a real PostgreSQL.
      DATABASE_URL: postgres://taskboard:taskboard@localhost:5432/taskboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-config:
    name: Deployment config (compose + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: docker compose -f deploy/single-server/docker-compose.yml --env-file deploy/single-server/.env.example config --quiet
      - name: Shellcheck scripts
        run: shellcheck -x deploy/single-server/scripts/*.sh deploy/single-server/nginx/render.sh
