# Serves the built React app. TLS and the /api proxy are handled in front of this
# (the edge proxy on a single server, an ingress on Kubernetes), so this image stays reusable.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /assets/ {
        # Vite fingerprints asset filenames, so they can be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
