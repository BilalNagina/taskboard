name: taskboard

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Settings shared by the api and worker containers (same image, different command).
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  APP_URL: https://${DOMAIN}
  LOG_LEVEL: info

services:
  # Edge proxy: terminates HTTPS, serves the ACME challenge, routes /api to the API.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx:/etc/nginx/taskboard:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    command: ["/bin/sh", "/etc/nginx/taskboard/render.sh"]
    depends_on:
      - api
      - web
    logging: *logging

  web:
    image: ghcr.io/${GH_OWNER}/taskboard-web:${TAG}
    restart: unless-stopped
    logging: *logging

  api:
    image: ghcr.io/${GH_OWNER}/taskboard-api:${TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  # Sends reminder emails from a Redis-backed job queue (BullMQ).
  worker:
    image: ghcr.io/${GH_OWNER}/taskboard-api:${TAG}
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *app-env
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Starts after the api, which runs the database migrations.
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Sessions and the job queue. Append-only persistence keeps both across restarts;
  # noeviction because BullMQ must never have queue keys evicted.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  pgdata:
  redisdata:
